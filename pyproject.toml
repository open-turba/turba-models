[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "turba-models"
version = "0.1.0"
description = "Model package for loading pretrained soil fertility and fertilizer recommendation models for Morocco."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Turba Open Lab" }
]
dependencies = [
  "numpy>=1.23",
  "pandas>=2.0",
  "scikit-learn>=1.6,<1.7",
  "joblib>=1.3",
  "lightgbm>=4,<5",
  "xgboost>=2,<3",
]
keywords = ["agriculture", "soil fertility", "fertilizer", "site-specific", "npk recommendations", "machine learning", "morocco"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Artificial Intelligence"
]

[project.urls]
Homepage = "https://github.com/open-turba/turba-models"
Repository = "https://github.com/open-turba/turba-models"
Issues = "https://github.com/open-turba/turba-models/issues"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
turba_models = ["model_registry.json", "models/*.joblib"]
